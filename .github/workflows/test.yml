name: Tests

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install graphics and audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libwayland-cursor0 libpulse0 fonts-dejavu-core xvfb xauth
      - name: Build and install the Python distribution
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl pytest
          python -m pip check
      - name: Verify first-use installation
        run: python tools/smoke.py
      - name: Run functional tests
        # Hardware timing comparisons require native Linux; hosted runners are VMs.
        run: python -m pytest -q tests --ignore=tests/test_hardware_comparison.py --junitxml=build/test-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          path: build/test-results.xml
